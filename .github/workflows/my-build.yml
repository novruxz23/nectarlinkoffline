# Manual cloud build: Android APK (debug-signed) and Windows installer.
# Run it from the repository's "Actions" tab: "My build" -> "Run workflow".
name: My build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and the Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 ndk;30.0.16248370 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pnectarlink.abis=arm64-v8a
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/Nectarlink-offline-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk

  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Build the installer
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/package/*-setup.exe
